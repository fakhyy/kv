[package]
name = "kv"
version = "0.1.0"
edition = "2024"
description = "A local key-value CLI backed by SQLite with optional SQLCipher encryption"
license = "MIT"

[[bin]]
name = "kv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# anyhow = "1"
thiserror = "2"
rpassword = "7"
directories = "6"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
